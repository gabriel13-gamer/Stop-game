function boom(n=70){const C=['#ff3b4e','#ffd23f','#2be3a0','#4da3ff','#c77dff','#fff'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${C[i%6]};--x:${(Math.random()-.5)*300}px;--r:${Math.random()*900}deg;--d:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*.4}s;border-radius:${i%3?'2px':'50%'};${i%4==0?'width:16px;height:16px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)':''}`;document.body.appendChild(e);setTimeout(()=>e.remove(),4400)}}
function spin(){const e=$('#lt');if(!e)return;const L=S.cfg.letters,f=S.letter;e.classList.add('spin');let n=0;const iv=setInterval(()=>{e.textContent=L[Math.random()*L.length|0];tone(300+n*25,.04,'square',.04);if(++n>10){clearInterval(iv);e.textContent=f;e.classList.remove('spin');SFX.go()}},65)}
function fx(){if(!S)return;const k=S.state+S.phase+S.ci+S.round;if(k==lfx)return;lfx=k;
  if(S.state=='round')spin();
  else if(S.phase=='sign'){SFX.stop();document.body.classList.add('shk');setTimeout(()=>document.body.classList.remove('shk'),600)}
  else if(S.phase=='done'){if(S.res.cats[S.cfg.cats[S.ci]].some(x=>x.pts>0)){SFX.pt();boom(22)}}
  else if(S.state=='results')SFX.go();
  else if(S.state=='final'){SFX.win();boom(120)}}
let mu=!LS.mute,mi=0,lpc=0,lf2='';
SFX.join=()=>{tone(784,.1,'triangle');tone(1175,.18,'triangle',.1,.09)};
function whoosh(){try{ac=ac||new AC();const n=ac.sampleRate*.25,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.setValueAtTime(400,ac.currentTime);f.frequency.exponentialRampToValueAtTime(3000,ac.currentTime+.25);g.gain.value=mu?.1:0;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}catch{}}
function fx2(){if(!S){document.body.classList.remove('hot');return}
  if(S.state!='round')document.body.classList.remove('hot');
  if(S.state=='lobby'){if(lpc&&S.players.length>lpc)SFX.join();lpc=S.players.length}
  const k=S.state+S.phase+S.ci;if(k==lf2)return;lf2=k;const l=S.res&&S.res.cats[S.cfg.cats[S.ci]];if(!l)return;
  if(S.phase=='show')l.forEach((x,i)=>tone(500+i*90,.07,'triangle',.07,i*.13));
  if(S.phase=='done')l.forEach((x,i)=>x.pts>0?tone(600+i*120,.12,'sine',.1,.1+i*.14):tone(150,.18,'sawtooth',.06,.1+i*.14));
  if(S.phase=='vote')tone(330,.15,'square',.05)}
